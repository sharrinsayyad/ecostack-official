<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOSTACK AI | Enterprise Terminal v3.5</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        // CEO ULTRA-SECURITY
        document.oncontextmenu = () => false;
        const sanitize = (str) => str.replace(/[<>]/g, tag => ({ '<': '&lt;', '>': '&gt;' }[tag]));
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap');
        :root { --emerald: #10b981; --bg: #030712; }
        body { background: var(--bg); color: #f8fafc; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        .emerald-glass { background: rgba(16, 185, 129, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(16, 185, 129, 0.1); }
        .admin-card { background: #0a0a0a; border: 1px solid #1a1a1a; transition: all 0.4s ease; position: relative; overflow: hidden; }
        .admin-card:hover { border-color: #10b981; }
        
        .code-font { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        .locked-overlay { background: rgba(0,0,0,0.95); backdrop-filter: blur(15px); transition: all 0.5s ease; }
        .hidden-element { display: none !important; }
        
        .btn-emerald { background: linear-gradient(135deg, #10b981 0%, #059669 100%); transition: all 0.3s ease; }
        
        /* STAMP SYSTEM FOR ADMIN */
        .stamp { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); font-size: 5rem; font-weight: 900; border: 8px solid; padding: 10px 40px; opacity: 0; pointer-events: none; z-index: 50; text-transform: uppercase; }
        .stamped-APPROVED { opacity: 0.4; color: #10b981; border-color: #10b981; }
        .stamped-REJECTED { opacity: 0.4; color: #ef4444; border-color: #ef4444; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4QK67Y22aYtzUgMNESQfXVax51Tk2zy0",
            authDomain: "autostack-ai.firebaseapp.com",
            projectId: "autostack-ai",
            storageBucket: "autostack-ai.firebasestorage.app",
            messagingSenderId: "35493907558",
            appId: "1:35493907558:web:34c1c21e5a85bcae2131a7"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let audit = { worst: 0, opt: 0, fee: 0, srv: 1, original: "", optimized: "" };

        // LOGIC: New Math & Real-time Update
        window.processAudit = function() {
            audit.original = document.getElementById('codeIn').value;
            audit.srv = Math.max(1, parseInt(document.getElementById('srvInput').value) || 1);
            
            if(audit.original.length < 5) return;

            const complexity = (audit.original.length * 0.1) + (audit.original.split('{').length * 10);
            audit.worst = complexity * 450 * audit.srv;
            audit.opt = complexity * 115 * audit.srv;
            audit.fee = ((audit.worst - audit.opt) * 0.35).toFixed(2);
            audit.optimized = `/* ECOSTACK V3.5 OPTIMIZED */\n\n` + audit.original.trim();

            document.getElementById('res3').innerText = "₹" + Math.floor(audit.worst - audit.opt).toLocaleString();
            document.getElementById('res4').innerText = "₹" + parseFloat(audit.fee).toLocaleString();
            
            const upi = `upi://pay?pa=sayyadsharrin0@okaxis&am=${audit.fee}&cu=INR&pn=ECOSTACK%20FEE`;
            document.getElementById('qrBox').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(upi)}" class="rounded-lg bg-white p-2">`;
        };

        window.requestApproval = function() {
            const rid = "ESTK-" + Math.floor(100000 + Math.random() * 900000);
            const reqRef = push(ref(db, 'history'));
            
            update(reqRef, {
                id: rid, status: "PENDING", original: audit.original, optimized: audit.optimized,
                worst: audit.worst, opt: audit.opt, fee: audit.fee, srv: audit.srv,
                timestamp: serverTimestamp()
            });

            // Status Listener for User
            onValue(reqRef, (snap) => {
                const s = snap.val()?.status;
                const layer = document.getElementById('lockLayer');
                const msg = document.getElementById('lockMsg');

                if(s === "APPROVED") {
                    layer.classList.add('hidden-element');
                    document.getElementById('codeOut').value = snap.val().optimized;
                    document.getElementById('downloadArea').classList.remove('hidden-element');
                } else if(s === "REJECTED") {
                    layer.style.background = "rgba(127, 29, 29, 0.98)";
                    msg.innerHTML = `<span class="text-white font-black text-xl">ACCESS DENIED</span><br>CEO REJECTED YOUR REQUEST`;
                }
            });
            alert("Sent to CEO. ID: " + rid);
        };

        window.ceoLogin = function() {
            if(document.getElementById('ceoKey').value === "rubinaramjan@14") {
                document.getElementById('userInterface').classList.add('hidden-element');
                document.getElementById('adminTerminal').classList.remove('hidden-element');
                syncAdmin();
            }
        };

        function syncAdmin() {
            onValue(ref(db, 'history'), (snap) => {
                const container = document.getElementById('adminFeed');
                container.innerHTML = "";
                const data = snap.val();
                if(data) Object.keys(data).reverse().forEach(key => {
                    const r = data[key];
                    container.innerHTML += `
                    <div class="admin-card p-10 rounded-[40px] mb-8">
                        <div class="stamp stamped-${r.status}">${r.status}</div>
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <h3 class="text-2xl font-black">${r.id}</h3>
                                <p class="text-[10px] text-emerald-500 font-bold">${new Date(r.timestamp).toLocaleString()}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="window.updateReq('${key}', 'APPROVED')" class="bg-emerald-600 px-6 py-2 rounded-xl text-[10px] font-bold">APPROVE</button>
                                <button onclick="window.updateReq('${key}', 'REJECTED')" class="bg-red-600 px-6 py-2 rounded-xl text-[10px] font-bold">REJECT</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-4 mb-6">
                            <div class="bg-black/50 p-4 rounded-2xl border border-white/5">
                                <p class="text-[8px] text-slate-500">WORST BILL</p>
                                <p class="text-lg font-bold">₹${Math.floor(r.worst).toLocaleString()}</p>
                            </div>
                            <div class="bg-black/50 p-4 rounded-2xl border border-white/5">
                                <p class="text-[8px] text-slate-500">OPT BILL</p>
                                <p class="text-lg font-bold">₹${Math.floor(r.opt).toLocaleString()}</p>
                            </div>
                            <div class="bg-emerald-900/20 p-4 rounded-2xl border border-emerald-500/30">
                                <p class="text-[8px] text-emerald-500 font-black">CEO FEE (35%)</p>
                                <p class="text-2xl font-black text-emerald-400">₹${parseFloat(r.fee).toLocaleString()}</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <pre class="bg-black p-4 rounded-2xl h-40 overflow-auto text-[10px] text-red-400/50">${sanitize(r.original)}</pre>
                            <pre class="bg-black p-4 rounded-2xl h-40 overflow-auto text-[10px] text-emerald-400">${sanitize(r.optimized)}</pre>
                        </div>
                    </div>`;
                });
            });
        }
        window.updateReq = (k, s) => update(ref(db, `history/${k}`), { status: s });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('codeIn').oninput = processAudit;
            document.getElementById('srvInput').oninput = processAudit;
        });
    </script>
</head>
<body class="p-4 md:p-8">

    <div id="adminTerminal" class="hidden-element max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <h1 class="text-4xl font-black">CEO DASHBOARD</h1>
            <button onclick="location.reload()" class="text-xs text-red-500">LOGOUT</button>
        </header>
        <div id="adminFeed"></div>
    </div>

    <div id="userInterface" class="max-w-7xl mx-auto">
        <header class="flex flex-col lg:flex-row justify-between items-center emerald-glass p-10 rounded-[50px] border-b-4 border-emerald-500 mb-12">
            <div>
                <h1 class="text-6xl font-black italic text-emerald-500 tracking-tighter">ECOSTACK AI</h1>
                <p class="text-[10px] text-slate-500 font-bold tracking-[0.4em] mt-2 uppercase">v3.5 Enterprise Engine</p>
            </div>
            <div class="flex gap-4 mt-8 lg:mt-0">
                <input type="number" id="srvInput" value="1" class="bg-black w-14 p-4 rounded-2xl text-xl font-black text-emerald-500 border border-white/10">
                <input type="password" id="ceoKey" oninput="ceoLogin()" placeholder="CEO ACCESS" class="bg-emerald-950/20 border border-emerald-500/20 px-6 py-4 rounded-2xl text-emerald-500 font-black outline-none w-40">
            </div>
        </header>

        <main class="grid lg:grid-cols-2 gap-10">
            <textarea id="codeIn" class="w-full h-[400px] bg-black border border-white/5 p-10 rounded-[60px] outline-none code-font text-slate-300 focus:border-emerald-500/30" placeholder="Paste legacy code..."></textarea>
            <div class="relative">
                <div id="lockLayer" class="absolute inset-0 z-20 locked-overlay flex flex-col items-center justify-center rounded-[60px] border border-emerald-500/10 text-center p-6">
                    <div class="w-12 h-12 border-4 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin mb-6"></div>
                    <p class="text-[10px] font-black text-emerald-500 uppercase tracking-widest" id="lockMsg">Awaiting CEO Verification</p>
                </div>
                <textarea id="codeOut" readonly class="w-full h-[400px] bg-[#050505] border border-emerald-500/10 p-10 rounded-[60px] outline-none code-font text-emerald-500/50 italic"></textarea>
            </div>
        </main>

        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-12">
            <div class="emerald-glass p-8 rounded-[35px]">
                <p class="text-[9px] text-slate-500 font-bold uppercase mb-2">Estimated Savings</p>
                <p id="res3" class="text-3xl font-black text-white">₹0</p>
            </div>
            <div class="bg-emerald-500/10 p-8 rounded-[35px] border border-emerald-500/20">
                <p class="text-[9px] text-emerald-400 font-bold uppercase mb-2">Service Fee (35%)</p>
                <p id="res4" class="text-4xl font-black text-emerald-500">₹0</p>
            </div>
            <div id="qrBox" class="emerald-glass flex items-center justify-center rounded-[35px] h-32">READY</div>
        </section>

        <footer class="mt-12 bg-[#080808] p-10 rounded-[60px] border border-white/5">
            <button onclick="requestApproval()" class="btn-emerald w-full py-10 rounded-[40px] font-black text-xs tracking-[0.4em] uppercase text-white shadow-2xl">
                Initialize CEO Handshake
            </button>
            <div id="downloadArea" class="hidden-element mt-4">
                <button onclick="generatePDF()" class="w-full bg-white text-black py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest">Download Audit PDF</button>
            </div>
        </footer>
    </div>
</body>
</html>
