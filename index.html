<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOSTACK AI | Enterprise Terminal v2.5</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        // CEO ULTRA-SECURITY 2.5
        document.oncontextmenu = () => false;
        document.onkeydown = (e) => {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };

        const sanitize = (str) => str.replace(/[<>]/g, tag => ({ '<': '&lt;', '>': '&gt;' }[tag]));
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap');
        :root { --emerald: #10b981; --bg: #030712; }
        body { background: var(--bg); color: #f8fafc; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* New Glassmorphism & Glow Effects */
        .emerald-glass { background: rgba(16, 185, 129, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(16, 185, 129, 0.1); }
        .admin-card { background: #0a0a0a; border: 1px solid #1a1a1a; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .admin-card:hover { border-color: #10b981; box-shadow: 0 0 30px rgba(16, 185, 129, 0.1); }
        
        .code-font { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        .locked-overlay { background: rgba(0,0,0,0.92); backdrop-filter: blur(15px); transition: all 0.5s ease; }
        .hidden-element { display: none !important; }
        
        /* Enhanced Buttons */
        .btn-emerald { background: linear-gradient(135deg, #10b981 0%, #059669 100%); transition: all 0.3s ease; position: relative; overflow: hidden; }
        .btn-emerald:active { transform: scale(0.98); }
        .btn-emerald::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent); transform: rotate(45deg); transition: 0.5s; }
        .btn-emerald:hover::after { left: 120%; }

        .status-approved { color: #10b981; border: 2px solid #10b981; padding: 4px 12px; border-radius: 6px; font-weight: 900; text-transform: uppercase; }
        
        /* Pulse Animation for QR */
        .qr-glow { box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); animation: pulse-border 2s infinite; }
        @keyframes pulse-border { 0% { border-color: rgba(16, 185, 129, 0.3); } 50% { border-color: #10b981; } 100% { border-color: rgba(16, 185, 129, 0.3); } }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Firebase Config (Keeping your original)
        const firebaseConfig = {
            apiKey: "AIzaSyD4QK67Y22aYtzUgMNESQfXVax51Tk2zy0",
            authDomain: "autostack-ai.firebaseapp.com",
            projectId: "autostack-ai",
            storageBucket: "autostack-ai.firebasestorage.app",
            messagingSenderId: "35493907558",
            appId: "1:35493907558:web:34c1c21e5a85bcae2131a7"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let audit = { units: 0, bill: 0, savings: 0, fee: 0, srv: 1, original: "", optimized: "" };

        // LOGIC: New Real-time Audit with better math
        window.processAudit = function() {
            audit.original = document.getElementById('codeIn').value;
            audit.srv = Math.max(1, parseInt(document.getElementById('srvInput').value) || 1);
            
            if(audit.original.length < 5) {
                resetDashboard();
                return;
            }

            // AI Optimization Logic Simulator
            audit.optimized = `/* ECOSTACK V2.5 OPTIMIZED */\n/* Nodes: ${audit.srv} | Latency Optimized */\n\n` + 
                              audit.original.replace(/\n\s*\n/g, '\n').trim();

            const complexityFactor = audit.original.split('{').length * 1.5;
            audit.units = (audit.original.length * 0.02 * audit.srv) + complexityFactor;
            audit.bill = (audit.units * 14.50) + (audit.srv * 450); 
            audit.savings = audit.bill * 0.82; // Increased efficiency
            audit.fee = (audit.savings * 0.35).toFixed(2);

            updateUI();
        };

        function updateUI() {
            document.getElementById('res1').innerText = audit.units.toFixed(1) + " kWh";
            document.getElementById('res3').innerText = "₹" + Math.floor(audit.savings).toLocaleString();
            document.getElementById('res4').innerText = "₹" + parseFloat(audit.fee).toLocaleString();
            
            const upi = `upi://pay?pa=sayyadsharrin0@okaxis&am=${audit.fee}&cu=INR&pn=ECOSTACK%20SERVICE%20FEE`;
            document.getElementById('qrBox').innerHTML = `
                <div class="p-2 bg-white rounded-2xl qr-glow">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(upi)}" class="rounded-lg">
                </div>`;
        }

        function resetDashboard() {
            document.getElementById('res1').innerText = "0 kWh";
            document.getElementById('res3').innerText = "₹0";
            document.getElementById('res4').innerText = "₹0";
            document.getElementById('qrBox').innerHTML = "READY";
        }

        window.requestApproval = function() {
            if(!audit.original || audit.fee <= 0) return alert("System requires valid code input.");
            
            const rid = "ESTK-" + Math.random().toString(36).substr(2, 6).toUpperCase();
            const log = {
                id: rid, timestamp: Date.now(),
                original: audit.original, optimized: audit.optimized,
                fee: audit.fee, srv: audit.srv, status: "PENDING"
            };

            push(ref(db, 'history'), log);
            
            // Notification UI
            document.getElementById('lockMsg').innerHTML = `<span class="text-white">REQUEST SENT:</span> <br> ${rid}`;
            
            // Opening WhatsApp (As per your details)
            setTimeout(() => {
                window.open(`https://wa.me/9096530829?text=ECOSTACK%20PAYMENT%20DONE%0AID:${rid}%0AFEE:₹${audit.fee}`);
            }, 1000);

            // Listen for Remote Unlock
            onValue(ref(db, 'history'), (snap) => {
                const data = snap.val();
                if(data) {
                    Object.values(data).forEach(item => {
                        if(item.id === rid && item.status === "APPROVED") {
                            unlockSystem(item.optimized);
                        }
                    });
                }
            });
        };

        function unlockSystem(code) {
            document.getElementById('lockLayer').style.opacity = "0";
            setTimeout(() => {
                document.getElementById('lockLayer').classList.add('hidden-element');
                document.getElementById('codeOut').value = code;
                document.getElementById('downloadArea').classList.remove('hidden-element'); 
                document.getElementById('statusTag').innerHTML = "CERTIFIED & SECURED ✓";
                document.getElementById('statusTag').className = "text-emerald-500 font-black px-8 animate-bounce";
            }, 500);
        }

        window.ceoLogin = function() {
            if(document.getElementById('ceoKey').value === "rubinaramjan@14") {
                document.getElementById('userInterface').style.opacity = "0";
                setTimeout(() => {
                    document.getElementById('userInterface').classList.add('hidden-element');
                    document.getElementById('adminTerminal').classList.remove('hidden-element');
                    syncAdmin();
                }, 400);
            }
        };

        function syncAdmin() {
            onValue(ref(db, 'history'), (snap) => {
                const container = document.getElementById('adminFeed');
                container.innerHTML = "";
                const data = snap.val();
                if(data) Object.keys(data).reverse().forEach(key => {
                    const r = data[key];
                    container.innerHTML += `
                    <div class="admin-card p-8 rounded-[40px] mb-8 border-l-4 ${r.status==='APPROVED'?'border-emerald-500':'border-yellow-600'}">
                        <div class="flex justify-between items-center mb-6">
                            <div>
                                <p class="text-emerald-500 font-mono text-xs">${r.id}</p>
                                <h3 class="text-xl font-bold text-white">${new Date(r.timestamp).toLocaleString()}</h3>
                            </div>
                            <div>
                                ${r.status === 'PENDING' ? `
                                    <button onclick="window.updateReq('${key}', 'APPROVED')" class="bg-emerald-600 px-6 py-2 rounded-xl text-xs font-bold text-white uppercase mr-2 hover:bg-emerald-400 transition-all">Grant Access</button>
                                ` : `<span class="status-approved">${r.status}</span>`}
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <pre class="bg-black/50 p-4 rounded-2xl h-32 overflow-auto text-[10px] text-slate-500 border border-white/5">${sanitize(r.original)}</pre>
                            <pre class="bg-emerald-950/20 p-4 rounded-2xl h-32 overflow-auto text-[10px] text-emerald-400 border border-emerald-500/10">${sanitize(r.optimized)}</pre>
                        </div>
                        <div class="mt-4 flex gap-6 text-xs font-bold">
                            <span class="text-emerald-500">PAYMENT: ₹${r.fee}</span>
                            <span class="text-slate-500 uppercase">Nodes: ${r.srv}</span>
                        </div>
                    </div>`;
                });
            });
        }
        window.updateReq = (k, s) => update(ref(db, `history/${k}`), { status: s });

        window.generatePDF = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFillColor(10, 10, 10); doc.rect(0, 0, 210, 297, 'F');
            doc.setTextColor(16, 185, 129); doc.setFontSize(30); doc.text("ECOSTACK AI", 20, 30);
            doc.setTextColor(255, 255, 255); doc.setFontSize(10);
            doc.text(`AUDIT ID: ESTK-${Date.now()}`, 20, 45);
            doc.text(`SAVINGS REALIZED: ₹${audit.savings.toFixed(2)}`, 20, 55);
            doc.line(20, 65, 190, 65);
            doc.text("ENGINEERING OPTIMIZATION:", 20, 80);
            doc.setTextColor(150, 150, 150);
            const splitLines = doc.splitTextToSize(audit.optimized, 170);
            doc.text(splitLines, 20, 90);
            doc.save(`Ecostack_Report.pdf`);
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('codeIn').oninput = processAudit;
            document.getElementById('srvInput').oninput = processAudit;
        });
    </script>
</head>
<body class="p-4 md:p-8">

    <div id="adminTerminal" class="hidden-element max-w-5xl mx-auto">
        <div class="flex justify-between items-end mb-12">
            <div>
                <h1 class="text-4xl font-black text-white tracking-tighter">CEO COMMAND</h1>
                <p class="text-emerald-500 text-xs font-bold tracking-[0.4em]">SYSTEM HIERARCHY: LEVEL 1</p>
            </div>
            <button onclick="location.reload()" class="text-[10px] border border-red-900/50 px-4 py-2 rounded-lg text-red-500 hover:bg-red-500/10 transition-all">LOGOUT</button>
        </div>
        <div id="adminFeed"></div>
    </div>

    <div id="userInterface" class="max-w-7xl mx-auto transition-opacity duration-500">
        <header class="flex flex-col lg:flex-row justify-between items-center emerald-glass p-8 md:p-12 rounded-[50px] border-b-4 border-emerald-500 mb-12">
            <div>
                <div class="flex items-center gap-3">
                    <div class="w-4 h-4 bg-emerald-500 rounded-full animate-pulse"></div>
                    <h1 class="text-5xl md:text-6xl font-black italic text-emerald-500 tracking-tighter">ECOSTACK AI</h1>
                </div>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-[0.4em] mt-2">Sustainable Computing Infrastructure</p>
            </div>
            
            <div class="flex flex-wrap justify-center gap-6 mt-8 lg:mt-0">
                <div class="bg-black/60 px-6 py-3 rounded-2xl border border-emerald-500/20 flex items-center gap-4">
                    <span class="text-[10px] font-black text-emerald-700 uppercase">Nodes</span>
                    <input type="number" id="srvInput" value="1" class="bg-transparent w-12 text-2xl font-black text-emerald-400 outline-none">
                </div>
                <input type="password" id="ceoKey" oninput="ceoLogin()" placeholder="CEO ACCESS" class="bg-emerald-950/30 border border-emerald-500/20 px-6 py-4 rounded-2xl text-center text-emerald-500 font-black outline-none w-44 focus:border-emerald-500 transition-all">
            </div>
        </header>

        <main class="grid lg:grid-cols-2 gap-10">
            <div class="space-y-4">
                <div class="flex justify-between px-6">
                    <span class="text-[10px] font-black text-emerald-900 uppercase">Source Environment</span>
                    <span class="text-[10px] font-black text-slate-700 uppercase">Input Terminal</span>
                </div>
                <textarea id="codeIn" class="w-full h-[400px] bg-black border border-white/5 p-10 rounded-[60px] outline-none code-font text-slate-300 focus:border-emerald-500/30 transition-all shadow-inner" placeholder="Paste legacy code here for audit..."></textarea>
            </div>
            
            <div class="relative space-y-4">
                <div class="flex justify-between px-6">
                    <span id="statusTag" class="text-[10px] font-black text-red-900 uppercase">Encrypted Core</span>
                    <span class="text-[10px] font-black text-slate-700 uppercase">Optimized Output</span>
                </div>
                <div id="lockLayer" class="absolute inset-0 z-20 locked-overlay flex flex-col items-center justify-center rounded-[60px] border border-emerald-500/10 mt-8">
                    <div class="w-16 h-16 border-4 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin mb-6"></div>
                    <p class="text-[10px] font-black text-emerald-500 uppercase tracking-widest text-center" id="lockMsg">Awaiting Data Analysis</p>
                </div>
                <textarea id="codeOut" readonly class="w-full h-[400px] bg-[#050505] border border-emerald-500/10 p-10 rounded-[60px] outline-none code-font text-emerald-500/50 italic" placeholder="// Awaiting secure handshake..."></textarea>
            </div>
        </main>

        <section class="grid grid-cols-2 md:grid-cols-4 gap-6 mt-12">
            <div class="emerald-glass p-8 rounded-[35px] text-center">
                <p class="text-[9px] text-slate-500 font-bold uppercase mb-2">Energy Load</p>
                <p id="res1" class="text-2xl font-black text-white">0 kWh</p>
            </div>
            <div class="emerald-glass p-8 rounded-[35px] text-center border-b-2 border-emerald-500">
                <p class="text-[9px] text-emerald-500 font-bold uppercase mb-2">Est. Recovery</p>
                <p id="res3" class="text-2xl font-black text-white">₹0</p>
            </div>
            <div class="bg-emerald-500/10 p-8 rounded-[35px] text-center border border-emerald-500/20">
                <p class="text-[9px] text-emerald-400 font-bold uppercase mb-2">Service Fee (35%)</p>
                <p id="res4" class="text-3xl font-black text-emerald-500">₹0</p>
            </div>
            <div class="emerald-glass p-8 rounded-[35px] text-center">
                <p class="text-[9px] text-slate-500 font-bold uppercase mb-2">Network</p>
                <p class="text-xl font-black text-emerald-600">ENCRYPTED</p>
            </div>
        </section>

        <footer class="mt-12 grid md:grid-cols-3 gap-8 items-center bg-[#080808] p-10 rounded-[60px] border border-white/5">
            <div id="qrBox" class="flex items-center justify-center text-emerald-900 font-black text-xs tracking-widest h-48 bg-black rounded-[40px] border border-white/5">
                READY
            </div>
            
            <div class="md:col-span-2 space-y-6">
                <button onclick="requestApproval()" class="btn-emerald w-full py-10 rounded-[40px] font-black text-xs tracking-[0.4em] uppercase text-white shadow-2xl">
                    Initialize CEO Handshake & Verify
                </button>
                <div id="downloadArea" class="hidden-element">
                    <button onclick="generatePDF()" class="w-full bg-white text-black py-6 rounded-[30px] text-[10px] font-black uppercase tracking-[0.2em] hover:bg-emerald-500 hover:text-white transition-all">
                        Export Technical Audit Dossier (.PDF)
                    </button>
                </div>
            </div>
        </footer>
    </div>

</body>
</html>
