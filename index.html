<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOSTACK AI | Enterprise Terminal v2.9</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        // CEO ULTRA-SECURITY
        document.oncontextmenu = () => false;
        const sanitize = (str) => str ? str.replace(/[<>]/g, tag => ({ '<': '&lt;', '>': '&gt;' }[tag])) : "";
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=JetBrains+Mono&display=swap');
        :root { --emerald: #10b981; --bg: #020617; }
        body { background: var(--bg); color: #f8fafc; font-family: 'Inter', sans-serif; }
        
        .admin-card { background: #0f172a; border: 1px solid #1e293b; position: relative; overflow: hidden; }
        .stamp-box {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg);
            font-size: 4rem; font-weight: 900; padding: 10px 30px; border: 10px solid;
            z-index: 50; pointer-events: none; opacity: 0; transition: 0.3s;
        }
        .stamped-APPROVED { opacity: 0.5; color: #10b981; border-color: #10b981; }
        .stamped-REJECTED { opacity: 0.5; color: #ef4444; border-color: #ef4444; }
        
        .code-font { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
        .hidden-element { display: none !important; }
        .btn-emerald { background: linear-gradient(135deg, #10b981 0%, #059669 100%); transition: 0.3s; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4QK67Y22aYtzUgMNESQfXVax51Tk2zy0",
            authDomain: "autostack-ai.firebaseapp.com",
            projectId: "autostack-ai",
            storageBucket: "autostack-ai.firebasestorage.app",
            messagingSenderId: "35493907558",
            appId: "1:35493907558:web:34c1c21e5a85bcae2131a7"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let audit = { worst: 0, opt: 0, savings: 0, ceo: 0, srv: 1, original: "", optimized: "" };

        // BILLING LOGIC
        window.processAudit = function() {
            audit.original = document.getElementById('codeIn').value;
            audit.srv = Math.max(1, parseInt(document.getElementById('srvInput').value) || 1);
            
            if(audit.original.length < 5) return;

            // Accurate Real-time Math
            const factor = (audit.original.length * 0.1) + (audit.original.split('{').length * 5);
            audit.worst = factor * 420 * audit.srv;
            audit.opt = factor * 85 * audit.srv;
            audit.savings = audit.worst - audit.opt;
            audit.ceo = audit.savings * 0.35;

            audit.optimized = `/* ECOSTACK OPTIMIZED v2.9 */\n/* Nodes: ${audit.srv} | Date: ${new Date().toLocaleDateString()} */\n\n` + 
                              audit.original.trim();

            document.getElementById('res_worst').innerText = "₹" + Math.floor(audit.worst).toLocaleString();
            document.getElementById('res_opt').innerText = "₹" + Math.floor(audit.opt).toLocaleString();
            document.getElementById('res_diff').innerText = "₹" + Math.floor(audit.savings).toLocaleString();
            document.getElementById('res_ceo').innerText = "₹" + Math.floor(audit.ceo).toLocaleString();
        };

        window.requestApproval = function() {
            const rid = "ESTK-" + Math.random().toString(36).substr(2, 6).toUpperCase();
            const requestData = {
                id: rid, timestamp: Date.now(),
                original: audit.original, optimized: audit.optimized,
                worst: audit.worst, opt: audit.opt, savings: audit.savings, ceo: audit.ceo,
                status: "PENDING"
            };
            
            const newRef = push(ref(db, 'history'));
            set(newRef, requestData);

            // Unlock Listener
            onValue(ref(db, 'history'), (snap) => {
                snap.forEach((child) => {
                    if(child.val().id === rid && child.val().status === "APPROVED") {
                        document.getElementById('lockLayer').classList.add('hidden-element');
                        document.getElementById('codeOut').value = child.val().optimized;
                        document.getElementById('downloadArea').classList.remove('hidden-element');
                    }
                });
            });
            window.open(`https://wa.me/9096530829?text=NEW%20REQUEST%20${rid}%20FEE:₹${Math.floor(audit.ceo)}`);
        };

        // ADMIN PANEL SYNC
        window.ceoLogin = function() {
            if(document.getElementById('ceoKey').value === "rubinaramjan@14") {
                document.getElementById('userInterface').classList.add('hidden-element');
                document.getElementById('adminTerminal').classList.remove('hidden-element');
                
                onValue(ref(db, 'history'), (snap) => {
                    const container = document.getElementById('adminFeed');
                    container.innerHTML = "";
                    const data = snap.val();
                    if(data) Object.keys(data).reverse().forEach(key => {
                        const r = data[key];
                        container.innerHTML += `
                        <div class="admin-card p-8 rounded-[40px] mb-8">
                            <div class="stamp-box stamped-${r.status}">${r.status}</div>
                            <div class="flex justify-between items-start mb-6">
                                <div>
                                    <h3 class="text-xl font-black">${r.id}</h3>
                                    <p class="text-[10px] text-slate-500">${new Date(r.timestamp).toLocaleString()}</p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="handleDecision('${key}', 'APPROVED')" class="bg-emerald-600 px-6 py-3 rounded-xl font-bold text-[10px]">APPROVE</button>
                                    <button onclick="handleDecision('${key}', 'REJECTED')" class="bg-red-600 px-6 py-3 rounded-xl font-bold text-[10px]">REJECT</button>
                                </div>
                            </div>
                            <div class="grid lg:grid-cols-2 gap-4 mb-6">
                                <pre class="bg-black/50 p-4 rounded-2xl h-60 overflow-auto code-font text-red-300/60 border border-red-900/20">${sanitize(r.original)}</pre>
                                <pre class="bg-black/50 p-4 rounded-2xl h-60 overflow-auto code-font text-emerald-400 border border-emerald-900/20">${sanitize(r.optimized)}</pre>
                            </div>
                            <div class="grid grid-cols-4 gap-4">
                                <div class="bg-slate-900 p-4 rounded-2xl"><p class="text-[8px] text-slate-500">WORST</p><p class="font-bold">₹${Math.floor(r.worst)}</p></div>
                                <div class="bg-slate-900 p-4 rounded-2xl"><p class="text-[8px] text-slate-500">OPT</p><p class="font-bold">₹${Math.floor(r.opt)}</p></div>
                                <div class="bg-slate-900 p-4 rounded-2xl"><p class="text-[8px] text-slate-500">SAVINGS</p><p class="font-bold">₹${Math.floor(r.savings)}</p></div>
                                <div class="bg-emerald-950 p-4 rounded-2xl border border-emerald-500/30"><p class="text-[8px] text-emerald-500">CEO 35%</p><p class="font-black text-emerald-400">₹${Math.floor(r.ceo)}</p></div>
                            </div>
                        </div>`;
                    });
                });
            }
        };

        window.handleDecision = (key, status) => update(ref(db, `history/${key}`), { status });

        window.generatePDF = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("ECOSTACK AUDIT REPORT", 20, 20);
            doc.text(`Worst Bill: Rs. ${Math.floor(audit.worst)}`, 20, 40);
            doc.text(`Optimized: Rs. ${Math.floor(audit.opt)}`, 20, 50);
            doc.text(`Savings: Rs. ${Math.floor(audit.savings)}`, 20, 60);
            doc.text(`CEO Fee (35%): Rs. ${Math.floor(audit.ceo)}`, 20, 70);
            doc.save("Report.pdf");
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('codeIn').oninput = processAudit;
        });
    </script>
</head>
<body class="p-4 md:p-10">

    <div id="adminTerminal" class="hidden-element max-w-5xl mx-auto">
        <h1 class="text-3xl font-black mb-10">ADMIN CONTROL</h1>
        <div id="adminFeed"></div>
    </div>

    <div id="userInterface" class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center p-10 bg-slate-900/50 rounded-[40px] border-b-4 border-emerald-500 mb-10">
            <h1 class="text-4xl font-black italic text-emerald-500">ECOSTACK AI</h1>
            <div class="flex gap-4">
                <input type="number" id="srvInput" value="1" oninput="processAudit()" class="bg-black w-16 p-2 rounded-xl text-emerald-500 text-center font-bold border border-white/10">
                <input type="password" id="ceoKey" oninput="ceoLogin()" placeholder="CEO ACCESS" class="bg-black p-2 rounded-xl text-xs w-32 border border-white/10">
            </div>
        </header>

        <main class="grid lg:grid-cols-2 gap-8 mb-10">
            <textarea id="codeIn" class="w-full h-80 bg-black p-6 rounded-[30px] border border-white/5 outline-none code-font" placeholder="Paste Code..."></textarea>
            <div class="relative">
                <div id="lockLayer" class="absolute inset-0 bg-black/95 backdrop-blur-md z-10 flex items-center justify-center rounded-[30px]">
                    <p class="text-xs font-bold text-emerald-500 animate-pulse">AWAITING APPROVAL</p>
                </div>
                <textarea id="codeOut" readonly class="w-full h-80 bg-black p-6 rounded-[30px] border border-emerald-500/20 code-font"></textarea>
            </div>
        </main>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
            <div class="bg-slate-900 p-6 rounded-3xl border-l-4 border-red-500"><p class="text-[10px] text-slate-500">WORST BILL</p><p id="res_worst" class="text-xl font-bold">₹0</p></div>
            <div class="bg-slate-900 p-6 rounded-3xl border-l-4 border-emerald-500"><p class="text-[10px] text-slate-500">OPTIMIZED BILL</p><p id="res_opt" class="text-xl font-bold">₹0</p></div>
            <div class="bg-slate-900 p-6 rounded-3xl border-l-4 border-blue-500"><p class="text-[10px] text-slate-500">SAVINGS</p><p id="res_diff" class="text-xl font-bold">₹0</p></div>
            <div class="bg-emerald-900/20 p-6 rounded-3xl border-l-4 border-yellow-500"><p class="text-[10px] text-yellow-500">CEO FEE (35%)</p><p id="res_ceo" class="text-2xl font-black text-yellow-500">₹0</p></div>
        </div>

        <footer class="flex flex-col md:flex-row gap-6 items-center">
            <div id="qrBox" class="w-40 h-40 bg-black rounded-3xl flex items-center justify-center text-[10px] text-emerald-900">QR READY</div>
            <div class="flex-1 w-full space-y-4">
                <button onclick="requestApproval()" class="btn-emerald w-full py-8 rounded-[30px] font-black text-white uppercase tracking-widest">Submit to CEO</button>
                <div id="downloadArea" class="hidden-element">
                    <button onclick="generatePDF()" class="w-full bg-white text-black py-3 rounded-2xl font-bold text-xs uppercase">Download PDF Report</button>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
