<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOSTACK AI | Enterprise Terminal v2.6</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        // CEO ULTRA-SECURITY 2.6 (Anti-Theft & Virus Protection)
        document.oncontextmenu = () => false;
        document.onkeydown = (e) => {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };

        // Sanitization to prevent Code Injection (Virus/Malware)
        const sanitize = (str) => {
            if (!str) return "";
            return str.replace(/[<>]/g, tag => ({ '<': '&lt;', '>': '&gt;' }[tag]));
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap');
        :root { --emerald: #10b981; --bg: #030712; }
        body { background: var(--bg); color: #f8fafc; font-family: 'Inter', sans-serif; overflow-x: hidden; -webkit-user-select: none; }
        
        .emerald-glass { background: rgba(16, 185, 129, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(16, 185, 129, 0.1); }
        .admin-card { background: #0a0a0a; border: 1px solid #1a1a1a; transition: all 0.4s ease; position: relative; overflow: hidden; }
        .admin-card:hover { border-color: #10b981; }
        
        .code-font { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        .locked-overlay { background: rgba(0,0,0,0.92); backdrop-filter: blur(15px); transition: all 0.5s ease; }
        .hidden-element { display: none !important; }
        
        /* STAMP EFFECTS */
        .stamp-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            font-size: 4rem; font-weight: 900;
            padding: 10px 40px; border: 8px solid;
            z-index: 50; pointer-events: none;
            opacity: 0.3; display: none;
            text-transform: uppercase;
        }
        .stamp-approved { display: block; color: #10b981; border-color: #10b981; }
        .stamp-rejected { display: block; color: #ef4444; border-color: #ef4444; }

        .btn-emerald { background: linear-gradient(135deg, #10b981 0%, #059669 100%); transition: all 0.3s ease; }
        .qr-glow { box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); animation: pulse-border 2s infinite; }
        @keyframes pulse-border { 0% { border-color: rgba(16, 185, 129, 0.3); } 50% { border-color: #10b981; } 100% { border-color: rgba(16, 185, 129, 0.3); } }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4QK67Y22aYtzUgMNESQfXVax51Tk2zy0",
            authDomain: "autostack-ai.firebaseapp.com",
            projectId: "autostack-ai",
            storageBucket: "autostack-ai.firebasestorage.app",
            messagingSenderId: "35493907558",
            appId: "1:35493907558:web:34c1c21e5a85bcae2131a7"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // State with new financial points
        let audit = { 
            units: 0, 
            worstBill: 0, 
            optimizedBill: 0, 
            savings: 0, 
            ceoCommission: 0, 
            srv: 1, 
            original: "", 
            optimized: "" 
        };

        window.processAudit = function() {
            audit.original = document.getElementById('codeIn').value;
            audit.srv = Math.max(1, parseInt(document.getElementById('srvInput').value) || 1);
            
            if(audit.original.length < 5) {
                resetDashboard();
                return;
            }

            // Logic: Accurate Billing Comparison
            const complexity = audit.original.split('{').length;
            audit.units = (audit.original.length * 0.05) + (complexity * 2);
            
            // 1. Worst Code Bill (High Inefficiency)
            audit.worstBill = (audit.units * 28.50 * audit.srv);
            
            // 2. Optimized Code Bill (Clean Logic)
            audit.optimizedBill = (audit.units * 8.20 * audit.srv);
            
            // 3. Difference (Savings)
            audit.savings = audit.worstBill - audit.optimizedBill;
            
            // 4. CEO Commission (35% of Savings)
            audit.ceoCommission = audit.savings * 0.35;

            audit.optimized = `/* ECOSTACK V2.6 OPTIMIZED */\n/* Security Level: Enterprise */\n\n` + 
                              audit.original.replace(/\n\s*\n/g, '\n').trim();

            updateUI();
        };

        function updateUI() {
            document.getElementById('res_worst').innerText = "₹" + Math.floor(audit.worstBill).toLocaleString();
            document.getElementById('res_opt').innerText = "₹" + Math.floor(audit.optimizedBill).toLocaleString();
            document.getElementById('res_diff').innerText = "₹" + Math.floor(audit.savings).toLocaleString();
            document.getElementById('res_ceo').innerText = "₹" + Math.floor(audit.ceoCommission).toLocaleString();
            
            const upi = `upi://pay?pa=sayyadsharrin0@okaxis&am=${audit.ceoCommission.toFixed(2)}&cu=INR&pn=CEO%20COMMISSION`;
            document.getElementById('qrBox').innerHTML = `
                <div class="p-2 bg-white rounded-2xl qr-glow">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(upi)}" class="rounded-lg">
                </div>`;
        }

        function resetDashboard() {
            const keys = ['res_worst', 'res_opt', 'res_diff', 'res_ceo'];
            keys.forEach(id => document.getElementById(id).innerText = "₹0");
            document.getElementById('qrBox').innerHTML = "READY";
        }

        window.requestApproval = function() {
            if(!audit.original || audit.ceoCommission <= 0) return alert("Valid code required.");
            
            const rid = "ESTK-" + Math.random().toString(36).substr(2, 6).toUpperCase();
            const log = {
                id: rid, timestamp: Date.now(),
                original: audit.original, optimized: audit.optimized,
                worst: audit.worstBill, optBill: audit.optimizedBill,
                savings: audit.savings, commission: audit.ceoCommission,
                srv: audit.srv, status: "PENDING"
            };

            push(ref(db, 'history'), log);
            document.getElementById('lockMsg').innerHTML = `ANALYSIS SENT: ${rid}`;
            
            setTimeout(() => {
                window.open(`https://wa.me/9096530829?text=ECOSTACK%20PAYMENT%20DONE%0AID:${rid}%0ACOMMISSION:₹${audit.ceoCommission.toFixed(2)}`);
            }, 1000);

            onValue(ref(db, 'history'), (snap) => {
                const data = snap.val();
                if(data) Object.values(data).forEach(item => {
                    if(item.id === rid && item.status === "APPROVED") unlockSystem(item.optimized);
                });
            });
        };

        function unlockSystem(code) {
            document.getElementById('lockLayer').classList.add('hidden-element');
            document.getElementById('codeOut').value = code;
            document.getElementById('downloadArea').classList.remove('hidden-element'); 
            document.getElementById('statusTag').innerHTML = "STAMP: APPROVED ✓";
        }

        window.ceoLogin = function() {
            if(document.getElementById('ceoKey').value === "rubinaramjan@14") {
                document.getElementById('userInterface').classList.add('hidden-element');
                document.getElementById('adminTerminal').classList.remove('hidden-element');
                syncAdmin();
            }
        };

        function syncAdmin() {
            onValue(ref(db, 'history'), (snap) => {
                const container = document.getElementById('adminFeed');
                container.innerHTML = "";
                const data = snap.val();
                if(data) Object.keys(data).reverse().forEach(key => {
                    const r = data[key];
                    container.innerHTML += `
                    <div class="admin-card p-6 rounded-[30px] mb-6 border border-white/10">
                        <div id="stamp-${key}" class="stamp-overlay ${r.status==='APPROVED'?'stamp-approved':r.status==='REJECTED'?'stamp-rejected':''}">
                            ${r.status}
                        </div>
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-white font-bold">${new Date(r.timestamp).toLocaleString()} | ${r.id}</h3>
                            <div class="flex gap-2">
                                <button onclick="window.updateReq('${key}', 'APPROVED')" class="bg-emerald-600 px-4 py-2 rounded-lg text-[10px] font-bold">APPROVE</button>
                                <button onclick="window.updateReq('${key}', 'REJECTED')" class="bg-red-600 px-4 py-2 rounded-lg text-[10px] font-bold">REJECT</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 gap-4">
                             <p class="text-[10px] text-emerald-500 uppercase font-black">Full Code View:</p>
                             <pre class="bg-black p-4 rounded-xl h-64 overflow-auto text-[11px] text-slate-400 border border-white/5 code-font">${sanitize(r.original)}</pre>
                        </div>
                        <div class="mt-4 grid grid-cols-4 gap-2 text-[10px] font-bold">
                            <div class="bg-red-900/20 p-2 rounded text-red-400">WORST: ₹${Math.floor(r.worst)}</div>
                            <div class="bg-emerald-900/20 p-2 rounded text-emerald-400">OPT: ₹${Math.floor(r.optBill)}</div>
                            <div class="bg-blue-900/20 p-2 rounded text-blue-400">SAVINGS: ₹${Math.floor(r.savings)}</div>
                            <div class="bg-yellow-900/20 p-2 rounded text-yellow-400">CEO (35%): ₹${Math.floor(r.commission)}</div>
                        </div>
                    </div>`;
                });
            });
        }
        window.updateReq = (k, s) => update(ref(db, `history/${k}`), { status: s });

        window.generatePDF = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const now = new Date().toLocaleString();

            doc.setFillColor(15, 15, 15); doc.rect(0, 0, 210, 297, 'F');
            doc.setTextColor(16, 185, 129); doc.setFontSize(22); doc.text("ECOSTACK AI - FINANCIAL AUDIT", 20, 30);
            
            doc.setTextColor(255, 255, 255); doc.setFontSize(10);
            doc.text(`Report Generated: ${now}`, 20, 45);
            doc.line(20, 50, 190, 50);

            doc.text(`1. Worst Code Estimated Bill: Rs. ${Math.floor(audit.worstBill)}`, 20, 65);
            doc.text(`2. Optimized Code Estimated Bill: Rs. ${Math.floor(audit.optimizedBill)}`, 20, 75);
            doc.text(`3. Total Financial Savings (Diff): Rs. ${Math.floor(audit.savings)}`, 20, 85);
            
            doc.setTextColor(255, 200, 0);
            doc.text(`4. CEO COMMISSION (35% OF SAVINGS): Rs. ${Math.floor(audit.ceoCommission)}`, 20, 100);

            doc.setTextColor(100, 100, 100);
            doc.text("OPTIMIZED CODE PREVIEW:", 20, 120);
            const splitLines = doc.splitTextToSize(audit.optimized, 170);
            doc.text(splitLines, 20, 130);
            
            doc.save(`Audit_Report_${Date.now()}.pdf`);
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('codeIn').oninput = processAudit;
            document.getElementById('srvInput').oninput = processAudit;
        });
    </script>
</head>
<body class="p-4 md:p-8">

    <div id="adminTerminal" class="hidden-element max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black text-white">ADMIN COMMAND CENTER</h1>
            <button onclick="location.reload()" class="bg-red-600 px-6 py-2 rounded-full text-xs font-bold">EXIT</button>
        </div>
        <div id="adminFeed"></div>
    </div>

    <div id="userInterface" class="max-w-7xl mx-auto">
        <header class="flex flex-col lg:flex-row justify-between items-center emerald-glass p-10 rounded-[40px] border-b-4 border-emerald-500 mb-10">
            <div>
                <h1 class="text-5xl font-black italic text-emerald-500 tracking-tighter">ECOSTACK AI</h1>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-[0.4em] mt-2">v2.6 SECURE ARCHITECTURE</p>
            </div>
            <div class="flex gap-4 mt-6 lg:mt-0">
                <div class="bg-black/60 px-6 py-2 rounded-xl border border-white/10">
                    <span class="text-[9px] block text-slate-500 uppercase">Load Nodes</span>
                    <input type="number" id="srvInput" value="1" class="bg-transparent text-xl font-bold text-emerald-400 outline-none w-12">
                </div>
                <input type="password" id="ceoKey" oninput="ceoLogin()" placeholder="CEO KEY" class="bg-emerald-950/20 border border-white/10 px-6 rounded-xl text-emerald-500 font-bold outline-none w-32 focus:border-emerald-500">
            </div>
        </header>

        <main class="grid lg:grid-cols-2 gap-8">
            <textarea id="codeIn" class="w-full h-[350px] bg-black border border-white/5 p-8 rounded-[40px] outline-none code-font text-slate-400" placeholder="Paste legacy code..."></textarea>
            <div class="relative">
                <div id="lockLayer" class="absolute inset-0 z-20 locked-overlay flex flex-col items-center justify-center rounded-[40px]">
                    <p id="lockMsg" class="text-emerald-500 font-black text-xs animate-pulse uppercase">Handshake Required</p>
                </div>
                <textarea id="codeOut" readonly class="w-full h-[350px] bg-black border border-emerald-500/10 p-8 rounded-[40px] code-font text-emerald-500/40 italic"></textarea>
            </div>
        </main>

        <section class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
            <div class="emerald-glass p-6 rounded-3xl border-l-4 border-red-500">
                <p class="text-[9px] text-slate-500 uppercase font-bold">1. Worst Code Bill</p>
                <p id="res_worst" class="text-xl font-black text-white">₹0</p>
            </div>
            <div class="emerald-glass p-6 rounded-3xl border-l-4 border-emerald-500">
                <p class="text-[9px] text-slate-500 uppercase font-bold">2. Optimized Bill</p>
                <p id="res_opt" class="text-xl font-black text-white">₹0</p>
            </div>
            <div class="emerald-glass p-6 rounded-3xl border-l-4 border-blue-500">
                <p class="text-[9px] text-slate-500 uppercase font-bold">3. Total Difference</p>
                <p id="res_diff" class="text-xl font-black text-white">₹0</p>
            </div>
            <div class="bg-emerald-500/10 p-6 rounded-3xl border-l-4 border-yellow-500">
                <p class="text-[9px] text-yellow-500 uppercase font-bold">4. CEO 35% Commission</p>
                <p id="res_ceo" class="text-2xl font-black text-yellow-500">₹0</p>
            </div>
        </section>

        <footer class="mt-8 grid md:grid-cols-3 gap-6 bg-black p-8 rounded-[40px] border border-white/5 items-center">
            <div id="qrBox" class="h-40 bg-zinc-950 rounded-3xl flex items-center justify-center text-[10px] font-black tracking-widest text-emerald-900 border border-white/5">READY</div>
            <div class="md:col-span-2 space-y-4">
                <button onclick="requestApproval()" id="statusTag" class="btn-emerald w-full py-8 rounded-[30px] font-black text-xs uppercase tracking-widest text-white">
                    Request CEO Approval & Optimization
                </button>
                <div id="downloadArea" class="hidden-element">
                    <button onclick="generatePDF()" class="w-full bg-white text-black py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-emerald-500 transition-all">
                        Download Audit Report (.PDF)
                    </button>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
