<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoStack AI - Full-Stack Control Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        .glow-rose { box-shadow: 0 0 15px rgba(244, 63, 94, 0.2); }
        .glow-cyan { box-shadow: 0 0 15px rgba(6, 182, 212, 0.2); }
        .scanner-line { animation: scanEffect 2s linear infinite; }
        @keyframes scanEffect {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 font-sans min-h-screen">

    <div id="ecostack-root"></div>

    <script type="text/babel">
        // Direct Firebase Live Storage Credentials Set
        const firebaseConfig = { databaseURL: "https://autostack-ai-c929b-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        const GEMINI_API_KEY = "AIzaSyCKAinwiLoTq3pyyblmXHye3_kK9f5Is5E";

        function EcoStackApp() {
            // Screen router and interface locking toggles
            const [viewMode, setViewMode] = React.useState('user'); // Options: 'user' | 'admin'
            const [worstCode, setWorstCode] = React.useState('');
            const [optimizedCode, setOptimizedCode] = React.useState('');
            const [systemLocked, setSystemLocked] = React.useState(true);
            const [adminKey, setAdminKey] = React.useState('');
            const [adminLogs, setAdminLogs] = React.useState([]);
            const [isScanning, setIsScanning] = React.useState(false);
            const [expandedRows, setExpandedRows] = React.useState({});

            // Calculations state parameters mapping layout fields
            const [metrics, setMetrics] = React.useState({
                worstBill: 0, optimizedBill: 0, netSavings: 0, ceoFee: 0, uniqueId: 'Awaiting Run...'
            });

            // Heartbeat: Fetch structural transaction ledger rows directly from Firebase channel
            React.useEffect(() => {
                const logsRef = database.ref('dashboard_transactions');
                logsRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if(data) {
                        const compiledList = Object.keys(data).map(key => ({
                            id: key, ...data[key]
                        })).reverse();
                        setAdminLogs(compiledList);
                    }
                });

                // Read global system unlock handshake status flag
                const statusRef = database.ref('system_secure_lock');
                statusRef.on('value', (snapshot) => {
                    const unlocked = snapshot.val();
                    if(unlocked !== null) {
                        setSystemLocked(!unlocked);
                    }
                });

                return () => {
                    logsRef.off();
                    statusRef.off();
                };
            }, []);

            // 1. Dynamic Server Bill Engine & Savings Matrix Calculator Formula
            const calculateWorstBillEstimates = (codeText) => {
                if(!codeText.trim()) return 0;
                
                let baseCost = 40;
                const loops = (codeText.match(/for\s*\(|while\s*\(|\.forEach|\.map/g) || []).length;
                const asyncs = (codeText.match(/async|await|fetch|axios|Promise/g) || []).length;
                const queries = (codeText.match(/select|insert|update|delete|db\./gi) || []).length;
                const lines = codeText.split('\n').length;

                // Standard Formula: (Allocated RAM * Execution Time Vector) * AWS Fixed Constraints Instance Cost
                let worstAllocatedRAM = 8; // GB units C5 Core
                let executionTimeEstimates = 1.2 + (loops * 2.2) + (asyncs * 1.5) + (queries * 3.8) + (lines * 0.04);
                let c5Rate = 180; // ₹180 fixed asset multiplier
                let totalCost = Math.round((worstAllocatedRAM * executionTimeEstimates) * c5Rate);

                if (totalCost > 20000) totalCost = 540;
                if (totalCost < 50) totalCost = 50;
                return totalCost;
            };

            const handleCodeInputChange = (e) => {
                const input = e.target.value;
                setWorstCode(input);
                const projectedWorst = calculateWorstBillEstimates(input);
                setMetrics(prev => ({ ...prev, worstBill: projectedWorst }));
            };

            // 2. Main Optimization Router Request Engine Pipeline
            const executeDeepOptimizationPipeline = () => {
                if(!worstCode.trim()) {
                    alert("Please drop unoptimized loops inside the workspace input text grid viewport frame first.");
                    return;
                }

                setIsScanning(true);

                setTimeout(async () => {
                    setIsScanning(false);

                    // Compute dynamic optimization variables
                    const computedWorst = metrics.worstBill;
                    // Formula Optimized: T3 Instance scaled metrics parameters
                    const computedSavings = Math.round(computedWorst * 0.45); // 45% targeted scale drop
                    const computedOptimized = computedWorst - computedSavings;
                    const computedCeoFee = Math.round(computedSavings * 0.35); // 35% CEO Cut formula

                    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                    let randomSequence = '';
                    for (let i = 0; i < 8; i++) randomSequence += chars.charAt(Math.floor(Math.random() * chars.length));
                    const newReqId = `ESTK-${randomSequence}-SECURE`;
                    const currentISOTimeStamp = new Date().toISOString();

                    setMetrics({
                        worstBill: computedWorst,
                        optimizedBill: computedOptimized,
                        netSavings: computedSavings,
                        ceoFee: computedCeoFee,
                        uniqueId: newReqId
                    });

                    // Sync parameters logs dictionary instantly onto Firebase database
                    await database.ref('dashboard_transactions').child(newReqId).set({
                        uniqueId: newReqId,
                        timestamp: currentISOTimeStamp,
                        worstBill: computedWorst,
                        optimizedBill: computedOptimized,
                        netSavings: computedSavings,
                        ceoFee: computedCeoFee,
                        worstCodeSnippet: worstCode,
                        optimizedCodeSnippet: "// Awaiting system core approval release token deployment confirmation script."
                    });

                    // Trigger direct integration call downstream to WhatsApp notify string template
                    const secureTextMsg = encodeURIComponent(
                        `====== ECOSTACK AI REQUEST ======\n` +
                        `ID: ${newReqId}\n` +
                        `TIME: ${new Date(currentISOTimeStamp).toLocaleString()}\n\n` +
                        `[FINANCIAL METRICS BLOCK]\n` +
                        `• Worst Code Bill: ₹${computedWorst}\n` +
                        `• Optimised Code Bill: ₹${computedOptimized}\n` +
                        `• Total Cloud Savings: ₹${computedSavings}\n` +
                        `• Corporate CEO Fee: ₹${computedCeoFee}\n\n` +
                        `Awaiting authorization key signature validation to unlock optimization layer compilation pipeline.`
                    );
                    window.open(`https://api.whatsapp.com/send?phone=9096530829&text=${secureTextMsg}`, '_blank');

                    // Fire fallback stream compilation if lock state permits or updates automatically
                    if(!systemLocked) {
                        fetchAICompiledPayload(newReqId, worstCode);
                    } else {
                        setOptimizedCode('// Operational pipeline layers locked. Awaiting dashboard administrator release trigger.');
                    }

                }, 2000);
            };

            // 3. Automated Core AI Engine Request Compilation Interface (Gemini Integration Loop)
            const fetchAICompiledPayload = async (reqId, payloadSourceCode) => {
                setOptimizedCode("// INTERCONNECTING ECOSTACK AI INTELLIGENCE COMPILER PIPELINE CHANNELS...");
                try {
                    const dynamicPrompt = `You are EcoStack AI. Optimize this cloud computing code framework to lower RAM scaling and CPU loop execution delays. Provide production-ready deployment scripts with comments:\n\n${payloadSourceCode}`;
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: dynamicPrompt }] }] })
                    });
                    const outputObj = await res.json();
                    const optimizedScriptOutput = outputObj.candidates[0].content.parts[0].text;
                    
                    setOptimizedCode(optimizedScriptOutput);
                    
                    // Update exact record segment array directly inside active Firebase cluster
                    await database.ref('dashboard_transactions').child(reqId).update({
                        optimizedCodeSnippet: optimizedScriptOutput
                    });
                } catch (error) {
                    setOptimizedCode("// Payload architecture compiled but streaming links mismatch upstream.");
                }
            };

            // 4. Secure Lock Protocol Anti-Hacking Token Handshake Action Gateway
            const verifySecureGatewayToken = async () => {
                if(adminKey === "sharrin123" || adminKey === "admin") {
                    await database.ref('system_secure_lock').set(true);
                    alert("Cryptographic signature match clear. System status approved.");
                    setAdminKey('');
                } else {
                    alert("Security access protocol authentication signature mismatch error.");
                }
            };

            const resetSecurityLockState = async () => {
                await database.ref('system_secure_lock').set(false);
                alert("Master control panel secured. Active channels locked.");
            };

            const toggleRowExpansion = (id) => {
                setExpandedRows(prev => ({ ...prev, [id]: !prev[id] }));
            };

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    
                    {/* 1. MASTER INTERFACE CONSOLE CONTROL HEADER */}
                    <header className="border-b border-slate-900 bg-[#030712]/90 sticky top-0 z-50 px-8 py-5 flex justify-between items-center">
                        <div className="flex items-center space-x-2">
                            <span className="text-2xl font-black tracking-widest text-emerald-400">ECOSTACK AI</span>
                            <span className="text-[9px] font-mono bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded border border-emerald-800 tracking-wider">CORE FULL-STACK</span>
                        </div>
                        <div>
                            <button 
                                onClick={() => setViewMode(viewMode === 'user' ? 'admin' : 'user')}
                                className="bg-slate-900 border border-slate-800 text-xs font-mono text-slate-300 px-4 py-2 rounded-lg hover:text-cyan-400 hover:border-cyan-500/30 transition-all uppercase tracking-widest cursor-pointer"
                            >
                                {viewMode === 'user' ? '🛡️ Admin Panel' : '💻 Exit Admin View'}
                            </button>
                        </div>
                    </header>

                    {/* DYNAMIC COMPONENT LAYER SCREEN CONSOLE CONTROLLER */}
                    {viewMode === 'user' ? (
                        <main className="max-w-7xl mx-auto px-6 py-8 space-y-6 w-full flex-grow">
                            
                            {/* 2. MAIN SECTION: TWO COLUMN CODE WORKSPACE COMPARISON GRID */}
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                {/* Left Input Terminal Column Box */}
                                <div className="bg-slate-900/20 border border-slate-900 p-6 rounded-2xl space-y-3 relative overflow-hidden">
                                    {isScanning && (
                                        <div className="absolute inset-0 bg-emerald-500/5 pointer-events-none">
                                            <div class="absolute left-0 right-0 h-0.5 bg-emerald-400 scanner-line shadow-[0_0_10px_#10b981]"></div>
                                        </div>
                                    )}
                                    <label className="block text-[11px] font-mono font-bold tracking-widest text-rose-400/80 uppercase">Worst Code</label>
                                    <textarea 
                                        value={worstCode}
                                        onChange={handleCodeInputChange}
                                        rows="13" 
                                        className="w-full bg-slate-950 border border-slate-900 rounded-xl p-4 font-mono text-sm text-rose-400 focus:outline-none focus:border-rose-500/30 transition-all placeholder:text-slate-800 resize-none" 
                                        placeholder="Paste worst code here..."
                                    />
                                </div>

                                {/* Right Output Terminal Compilation Box */}
                                <div className="bg-slate-900/20 border border-slate-900 p-6 rounded-2xl space-y-3 relative">
                                    <div className="flex justify-between items-center">
                                        <label className="block text-[11px] font-mono font-bold tracking-widest text-emerald-400/80 uppercase">Optimized Code</label>
                                        {systemLocked && <span className="text-[9px] font-mono text-amber-500 bg-amber-950/30 px-2 py-0.5 rounded border border-amber-900/30">LOCK ACTIVE: AWAITING AUTHORIZATION HANDSHAKE</span>}
                                    </div>
                                    <textarea 
                                        value={systemLocked ? '// Output stream locked. Submit dynamic signature via verification admin panel dashboard nodes to build source structures.' : optimizedCode}
                                        readOnly
                                        rows="13" 
                                        className={`w-full bg-slate-950 border border-slate-900 rounded-xl p-4 font-mono text-sm focus:outline-none transition-all resize-none ${systemLocked ? 'text-slate-700 select-none' : 'text-emerald-400'}`} 
                                        placeholder="Paste optimized code here..."
                                    />
                                </div>
                            </div>

                            {/* 3. ANALYTICS ROW COMPONENT METRICS GRID */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                <div className="bg-slate-900/10 border border-slate-900 p-5 rounded-xl glow-rose">
                                    <span class="text-[10px] font-mono font-bold tracking-widest text-slate-500 uppercase">Worst Code Bill</span>
                                    <div className="text-2xl font-black text-rose-500 mt-1">₹{metrics.worstBill}</div>
                                </div>

                                <div className="bg-slate-900/10 border border-slate-900 p-5 rounded-xl">
                                    <span class="text-[10px] font-mono font-bold tracking-widest text-slate-500 uppercase">Optimized Code Bill</span>
                                    <div className="text-2xl font-black text-slate-400 mt-1">₹{metrics.optimizedBill}</div>
                                </div>

                                <div className="bg-slate-900/10 border border-slate-900 p-5 rounded-xl border-l-2 border-l-emerald-500 shadow-md">
                                    <span class="text-[10px] font-mono font-bold tracking-widest text-emerald-400 uppercase">Total Savings</span>
                                    <div className="text-2xl font-black text-emerald-400 mt-1">₹{metrics.netSavings}</div>
                                </div>

                                <div className="bg-slate-900/10 border border-slate-900 p-5 rounded-xl glow-cyan">
                                    <span class="text-[10px] font-mono font-bold tracking-widest text-slate-400 uppercase">CEO Fee</span>
                                    <div className="text-2xl font-black text-cyan-400 mt-1">₹{metrics.ceoFee}</div>
                                </div>
                            </div>

                            {/* 4. ACTION & PAYMENT FOOTER BLOCK ROW */}
                            <div className="grid grid-cols-1 md:grid-cols-12 gap-6 pt-4">
                                {/* Left Section Element: Dynamic QR Code Placeholder Frame */}
                                <div className="md:col-span-4 border border-slate-900 bg-slate-900/10 p-5 rounded-2xl flex items-center space-x-4">
                                    <div className="bg-white p-2 rounded-xl shrink-0 w-20 h-20 flex items-center justify-center">
                                        <svg className="w-full h-full text-slate-950" fill="currentColor" viewBox="0 0 24 24">
                                            <path d="M3 3h6v6H3V3zm2 2v2h2V5H5zm8-2h6v6h-6V3zm2 2v2h2V5h-2zM3 15h6v6H3v-6zm2 2v2h2v-2H5zm13-2h3v2h-3v-2zm3 3h-3v3h3v-3zm-3-3h-2v2h2v-2zm-3 3h-2v3h2v-3zm2 2h-2v1h2v-1zm-2-5h-2v2h2v-2zm-2 2H9v2h2v-2z"/>
                                        </svg>
                                    </div>
                                    <div className="font-mono text-left">
                                        <h4 className="text-xs font-bold tracking-wider text-slate-300 uppercase">Dynamic QR Code</h4>
                                        <p className="text-[10px] text-slate-600 mt-1 leading-relaxed">Scan real-time computational pipeline key vectors map endpoints.</p>
                                    </div>
                                </div>

                                {/* Right Section Element: Structural Alerts & Primary Call Buttons */}
                                <div className="md:col-span-8 bg-slate-900/20 border border-slate-900 p-6 rounded-2xl flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                                    <div className="font-mono text-left space-y-1">
                                        <span className="text-[10px] text-slate-500 block uppercase tracking-widest font-bold">PIPELINE NETWORK LOG STREAM</span>
                                        <div className="text-xs flex items-center space-x-2">
                                            <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse inline-block"></span>
                                            <span className="text-amber-400 font-bold tracking-wider uppercase">Notify CEO</span>
                                            <span className="text-slate-600 text-[10px]">({metrics.uniqueId})</span>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={executeDeepOptimizationPipeline}
                                        disabled={isScanning}
                                        className="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 disabled:from-slate-800 disabled:to-slate-800 disabled:text-slate-500 text-slate-950 font-mono text-xs font-bold tracking-widest uppercase px-8 py-4 rounded-xl transition-all shadow-md active:scale-[0.99] cursor-pointer"
                                    >
                                        {isScanning ? 'Processing Task...' : 'Request Access'}
                                    </button>
                                </div>
                            </div>

                        </main>
                    ) : (
                        /* 5. ADMINISTRATIVE METRICS VIEW WORKSPACE & DATA GRID TABLE */
                        <main className="max-w-7xl mx-auto px-6 py-8 space-y-6 w-full flex-grow">
                            
                            {/* SECURE SYSTEM LOCK GATEWAY HOOK ELEMENT */}
                            <div className="bg-slate-950 border border-cyan-900/20 p-6 rounded-2xl flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                                <div className="text-left font-mono">
                                    <h3 className="text-sm font-bold text-cyan-400 uppercase tracking-wider">🛡️ Security Gateway Layer Control</h3>
                                    <p className="text-xs text-slate-500 mt-1 leading-relaxed">System Lock Status: {systemLocked ? <span className="text-rose-500 font-bold">RESTRICTED MASTER CONTROL LOCKED</span> : <span className="text-emerald-400 font-bold">UNLOCKED OPERATIONAL DEPLOYMENT LIVE</span>}</p>
                                </div>
                                <div className="flex space-x-2 shrink-0">
                                    <input 
                                        type="password" 
                                        value={adminKey}
                                        onChange={(e) => setAdminKey(e.target.value)}
                                        placeholder="Enter CEO Approved Code" 
                                        className="bg-slate-900 border border-slate-800 rounded-lg px-4 py-2 text-xs font-mono focus:outline-none focus:border-cyan-500 text-slate-200 w-56"
                                    />
                                    <button 
                                        onClick={verifySecureGatewayToken}
                                        className="bg-cyan-950 hover:bg-cyan-900 border border-cyan-800 text-cyan-400 text-xs font-mono px-4 py-2 rounded-lg transition-all uppercase tracking-wider cursor-pointer"
                                    >
                                        Unlock Console
                                    </button>
                                    {!systemLocked && (
                                        <button 
                                            onClick={resetSecurityLockState}
                                            className="bg-rose-950 border border-rose-800 text-rose-400 text-xs font-mono px-3 py-2 rounded-lg hover:bg-rose-900 transition-all uppercase"
                                        >
                                            Lock Core
                                        </button>
                                    )}
                                </div>
                            </div>

                            {/* ADMINISTRATIVE SECURE LOGGER DATA GRID VIEW TABLE */}
                            <div className="bg-slate-900/10 border border-slate-900 rounded-2xl overflow-hidden shadow-2xl">
                                <div className="overflow-x-auto w-full">
                                    <table className="w-full text-left border-collapse font-mono text-xs">
                                        <thead>
                                            <tr className="bg-slate-950 text-slate-400 border-b border-slate-900 uppercase font-bold text-[10px] tracking-widest">
                                                <th className="p-4">Unique ID</th>
                                                <th className="p-4">Date & Time</th>
                                                <th className="p-4 text-right">Worst Code Bill</th>
                                                <th className="p-4 text-right">Optimized Code Bill</th>
                                                <th className="p-4 text-right">Net Savings</th>
                                                <th className="p-4 text-right text-cyan-400">CEO Fee</th>
                                                <th className="p-4 text-center">Action Payload</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-900/60 bg-slate-950/20">
                                            {adminLogs.length === 0 ? (
                                                <tr>
                                                    <td colSpan="7" className="p-8 text-center text-slate-600 font-mono text-xs">No transaction trace metrics payloads discovered inside the tracking ledgers.</td>
                                                </tr>
                                            ) : (
                                                adminLogs.map((log) => (
                                                    <React.Fragment key={log.id}>
                                                        <tr className="hover:bg-slate-900/40 transition-colors">
                                                            <td className="p-4 font-bold text-slate-300">{log.uniqueId}</td>
                                                            <td className="p-4 text-slate-500">{new Date(log.timestamp).toLocaleString()}</td>
                                                            <td className="p-4 text-right text-rose-400 font-bold">₹{log.worstBill}</td>
                                                            <td className="p-4 text-right text-slate-400">₹{log.optimizedBill}</td>
                                                            <td className="p-4 text-right text-emerald-400 font-bold">₹{log.netSavings}</td>
                                                            <td className="p-4 text-right text-cyan-400 font-black">₹{log.ceoFee}</td>
                                                            <td className="p-4 text-center">
                                                                <button 
                                                                    onClick={() => toggleRowExpansion(log.id)}
                                                                    className="text-[10px] uppercase bg-slate-900 hover:bg-slate-800 border border-slate-800 px-3 py-1 rounded text-slate-400 hover:text-slate-100 transition-all cursor-pointer font-bold"
                                                                >
                                                                    {expandedRows[log.id] ? 'Collapse ✕' : 'Expand Code ⚙️'}
                                                                </button>
                                                            </td>
                                                        </tr>
                                                        {/* EXPANDABLE COLLAPSIBLE TEXT CONTAINER CODE ROW EXTENSION */}
                                                        {expandedRows[log.id] && (
                                                            <tr className="bg-slate-950/90">
                                                                <td colSpan="7" className="p-5 border-t border-b border-slate-900">
                                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-left">
                                                                        <div className="space-y-1.5">
                                                                            <span className="text-[9px] font-bold text-rose-500 uppercase tracking-widest">[Source Worst Code Payload Snippet]</span>
                                                                            <pre className="bg-[#020617] p-4 rounded-xl border border-slate-900 text-rose-400 text-[11px] max-h-48 overflow-y-auto whitespace-pre-wrap font-mono">{log.worstCodeSnippet}</pre>
                                                                        </div>
                                                                        <div className="space-y-1.5">
                                                                            <span className="text-[9px] font-bold text-emerald-400 uppercase tracking-widest">[Source Optimized Code Payload Snippet]</span>
                                                                            <pre className="bg-[#020617] p-4 rounded-xl border border-slate-900 text-emerald-400 text-[11px] max-h-48 overflow-y-auto whitespace-pre-wrap font-mono">{log.optimizedCodeSnippet}</pre>
                                                                        </div>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        )}
                                                    </React.Fragment>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                        </main>
                    )}

                    {/* PLATFORM LOWER MATRIX BAR */}
                    <footer className="border-t border-slate-950 bg-slate-950/20 py-4 text-center font-mono text-[10px] text-slate-700 tracking-widest uppercase">
                        EcoStack AI Infrastructure Resource Router Networks Ltd.
                    </footer>

                </div>
            );
        }

        const rootNode = ReactDOM.createRoot(document.getElementById('ecostack-root'));
        rootNode.render(<EcoStackApp />);
    </script>
</body>
</html>
