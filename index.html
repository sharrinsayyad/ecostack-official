<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOSTACK AI | Enterprise Terminal v4.3</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');
        :root { --emerald: #10b981; --bg: #020617; }
        body { background: var(--bg); color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .admin-card { background: #0a0a0a; border: 1px solid #1e293b; border-radius: 35px; margin-bottom: 2rem; position: relative; overflow: hidden; }
        .stamp { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); font-size: 5rem; font-weight: 900; border: 10px solid; padding: 10px 40px; opacity: 0; z-index: 50; pointer-events: none; text-transform: uppercase; transition: 0.4s; }
        .stamped-APPROVED { opacity: 0.5; color: #10b981; border-color: #10b981; }
        .stamped-REJECTED { opacity: 0.5; color: #ef4444; border-color: #ef4444; }
        .code-font { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
        .locked-overlay { background: rgba(0,0,0,0.97); backdrop-filter: blur(25px); transition: all 0.5s ease; }
        .hidden-element { display: none !important; }
        .btn-emerald { background: linear-gradient(135deg, #10b981 0%, #059669 100%); transition: 0.3s; filter: drop-shadow(0 10px 15px rgba(16, 185, 129, 0.2)); }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4QK67Y22aYtzUgMNESQfXVax51Tk2zy0",
            authDomain: "autostack-ai.firebaseapp.com",
            projectId: "autostack-ai",
            storageBucket: "autostack-ai.firebasestorage.app",
            messagingSenderId: "35493907558",
            appId: "1:35493907558:web:34c1c21e5a85bcae2131a7"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Global audit object to prevent PDF variable errors
        window.audit = { id: "TEMP", energy: 0, worst: 0, opt: 0, savings: 0, fee: 0, srv: 1, original: "", optimized: "" };

        // 1. BILLING CALCULATION
        window.processAudit = function() {
            const code = document.getElementById('codeIn').value;
            window.audit.srv = Math.max(1, parseInt(document.getElementById('srvInput').value) || 1);
            if(code.length < 5) return;

            const complexity = (code.length * 0.05) + (code.split('{').length * 5);
            window.audit.energy = (complexity * 0.02 * window.audit.srv).toFixed(2);
            window.audit.worst = complexity * 150 * window.audit.srv; 
            window.audit.opt = complexity * 40 * window.audit.srv;    
            window.audit.savings = window.audit.worst - window.audit.opt;
            window.audit.fee = (window.audit.savings * 0.35).toFixed(2);
            window.audit.original = code;
            window.audit.optimized = `/* ECOSTACK ENGINE v4.3 */\n/* Optimized System Architecture */\n\n` + code.trim();

            document.getElementById('stat_energy').innerText = window.audit.energy + " kWh";
            document.getElementById('stat_worst').innerText = "₹" + Math.floor(window.audit.worst).toLocaleString();
            document.getElementById('stat_opt').innerText = "₹" + Math.floor(window.audit.opt).toLocaleString();
            document.getElementById('stat_diff').innerText = "₹" + Math.floor(window.audit.savings).toLocaleString();
            document.getElementById('stat_fee').innerText = "₹" + parseFloat(window.audit.fee).toLocaleString();
            
            const upi = `upi://pay?pa=sayyadsharrin0@okaxis&am=${window.audit.fee}&cu=INR&pn=ECOSTACK%20SERVICE`;
            document.getElementById('qrBox').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(upi)}" class="bg-white p-2 rounded-xl">`;
        };

        // 2. SUBMIT REQUEST & WHATSAPP
        window.requestApproval = function() {
            if(!window.audit.original) return alert("Please enter code.");
            
            // Unique ID generation
            window.audit.id = "ESTK-" + Math.floor(100000 + Math.random() * 900000);
            
            const reqRef = push(ref(db, 'history'));
            update(reqRef, {
                id: window.audit.id, status: "PENDING", original: window.audit.original, optimized: window.audit.optimized,
                energy: window.audit.energy, worst: window.audit.worst, opt: window.audit.opt, 
                savings: window.audit.savings, fee: window.audit.fee, srv: window.audit.srv,
                timestamp: serverTimestamp()
            });

            onValue(reqRef, (snap) => {
                const s = snap.val()?.status;
                if(s === "APPROVED") {
                    document.getElementById('lockLayer').classList.add('hidden-element');
                    document.getElementById('codeOut').value = snap.val().optimized;
                    document.getElementById('downloadArea').classList.remove('hidden-element');
                } else if(s === "REJECTED") {
                    document.getElementById('lockLayer').style.background = "rgba(153, 27, 27, 0.98)";
                    document.getElementById('lockMsg').innerHTML = `<span class="text-2xl font-black">ACCESS DENIED</span><br>CEO REJECTED YOUR PAYMENT`;
                }
            });

            const waMsg = `*NEW AUDIT REQUEST*%0AID: ${window.audit.id}%0A*FEE: ₹${window.audit.fee}*%0AWorst Bill: ₹${Math.floor(window.audit.worst)}%0ASavings: ₹${Math.floor(window.audit.savings)}`;
            window.open(`https://wa.me/9096530829?text=${waMsg}`);
        };

        // 3. ADMIN PANEL SYNC
        window.ceoLogin = function() {
            if(document.getElementById('ceoKey').value === "rubinaramjan@14") {
                document.getElementById('userInterface').classList.add('hidden-element');
                document.getElementById('adminTerminal').classList.remove('hidden-element');
                syncAdmin();
            }
        };

        function syncAdmin() {
            onValue(ref(db, 'history'), (snap) => {
                const container = document.getElementById('adminFeed'); container.innerHTML = "";
                const data = snap.val();
                if(data) Object.keys(data).reverse().forEach(key => {
                    const r = data[key];
                    container.innerHTML += `
                    <div class="admin-card p-8">
                        <div class="stamp stamped-${r.status}">${r.status}</div>
                        <div class="flex justify-between items-start mb-6 border-b border-white/5 pb-4">
                            <div><h3 class="text-2xl font-black text-emerald-500">${r.id}</h3><p class="text-[10px] opacity-50 uppercase">${new Date(r.timestamp).toLocaleString()}</p></div>
                            <div class="flex gap-2">
                                <button onclick="window.updateReq('${key}', 'APPROVED')" class="bg-emerald-600 px-6 py-2 rounded-xl text-[10px] font-bold">APPROVE</button>
                                <button onclick="window.updateReq('${key}', 'REJECTED')" class="bg-red-600 px-6 py-2 rounded-xl text-[10px] font-bold">REJECT</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-4 gap-4 text-center">
                            <div class="bg-black/50 p-4 rounded-2xl"><p class="text-[8px] opacity-50">WORST</p><p class="font-bold text-red-400">₹${Math.floor(r.worst)}</p></div>
                            <div class="bg-black/50 p-4 rounded-2xl"><p class="text-[8px] opacity-50">OPT</p><p class="font-bold text-emerald-400">₹${Math.floor(r.opt)}</p></div>
                            <div class="bg-black/50 p-4 rounded-2xl"><p class="text-[8px] opacity-50">SAVINGS</p><p class="font-bold">₹${Math.floor(r.savings)}</p></div>
                            <div class="bg-emerald-950/40 p-4 rounded-2xl border border-emerald-500/30"><p class="text-[8px] text-emerald-500 font-bold">FEE</p><p class="text-xl font-black text-emerald-400">₹${r.fee}</p></div>
                        </div>
                    </div>`;
                });
            });
        }
        window.updateReq = (k, s) => update(ref(db, `history/${k}`), { status: s });

        // 4. FIXED PDF DOWNLOAD LOGIC
        window.generatePDF = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const now = new Date().toLocaleString();

            // Header Logo Area
            doc.setFillColor(16, 185, 129); doc.rect(0, 0, 210, 40, 'F');
            doc.setTextColor(255, 255, 255); doc.setFontSize(28); doc.setFont("helvetica", "bold");
            doc.text("ECOSTACK AI", 20, 28);
            
            // Subtitle & Date
            doc.setTextColor(0, 0, 0); doc.setFontSize(10);
            doc.text(`AUDIT ID: ${window.audit.id}`, 20, 50);
            doc.text(`DATE: ${now}`, 120, 50);
            doc.setLineWidth(0.5); doc.line(20, 55, 190, 55);

            // Financial Table (As per your Image)
            doc.setFontSize(14); doc.setFont("helvetica", "bold");
            doc.text("AUDIT FINANCIAL SUMMARY", 20, 70);
            
            doc.setFont("helvetica", "normal"); doc.setFontSize(12);
            doc.text(`Energy Load: ${window.audit.energy} kWh`, 25, 85);
            doc.text(`Worst Case Bill: Rs. ${Math.floor(window.audit.worst)}`, 25, 95);
            doc.text(`Optimized Bill: Rs. ${Math.floor(window.audit.opt)}`, 25, 105);
            doc.text(`Net Savings: Rs. ${Math.floor(window.audit.savings)}`, 25, 115);
            
            doc.setTextColor(16, 185, 129); doc.setFont("helvetica", "bold");
            doc.text(`Service Fee Paid: Rs. ${window.audit.fee}`, 25, 125);

            // Code Analysis Page 1
            doc.setTextColor(0, 0, 0); doc.setFontSize(14); doc.text("SOURCE CODE ANALYSIS", 20, 145);
            doc.setFontSize(8); doc.setFont("courier", "normal");
            const origSplit = doc.splitTextToSize(window.audit.original, 170);
            doc.text(origSplit, 25, 155);

            // Code Analysis Page 2
            doc.addPage();
            doc.setFontSize(14); doc.setFont("helvetica", "bold"); doc.text("OPTIMIZED INFRASTRUCTURE", 20, 20);
            doc.setFontSize(8); doc.setFont("courier", "normal");
            const optSplit = doc.splitTextToSize(window.audit.optimized, 170);
            doc.text(optSplit, 20, 30);

            doc.save(`ECOSTACK_AUDIT_${window.audit.id}.pdf`);
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('codeIn').oninput = window.processAudit;
            document.getElementById('srvInput').oninput = window.processAudit;
        });
    </script>
</head>
<body class="p-4 md:p-8">

    <div id="adminTerminal" class="hidden-element max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-12">
            <h1 class="text-4xl font-black uppercase">CEO Terminal</h1>
            <button onclick="location.reload()" class="bg-red-500/10 text-red-500 px-6 py-2 rounded-full font-bold text-xs">LOGOUT</button>
        </header>
        <div id="adminFeed"></div>
    </div>

    <div id="userInterface" class="max-w-7xl mx-auto">
        <header class="flex flex-col lg:flex-row justify-between items-center glass p-10 rounded-[50px] border-b-4 border-emerald-500 mb-12">
            <h1 class="text-5xl font-black italic text-emerald-500 tracking-tighter">ECOSTACK AI</h1>
            <div class="flex gap-4 mt-8 lg:mt-0">
                <input type="number" id="srvInput" value="1" class="bg-black w-14 p-4 rounded-2xl text-xl font-black text-emerald-500 border border-white/10 outline-none">
                <input type="password" id="ceoKey" oninput="ceoLogin()" placeholder="ADMIN" class="bg-emerald-950/20 border border-emerald-500/20 px-6 py-4 rounded-2xl text-emerald-500 font-black outline-none w-44">
            </div>
        </header>

        <main class="grid lg:grid-cols-2 gap-10">
            <textarea id="codeIn" class="w-full h-[350px] bg-black border border-white/5 p-8 rounded-[50px] outline-none code-font text-slate-400" placeholder="Paste source code..."></textarea>
            <div class="relative">
                <div id="lockLayer" class="absolute inset-0 z-20 locked-overlay flex flex-col items-center justify-center rounded-[50px] border border-emerald-500/10 text-center">
                    <p id="lockMsg" class="text-[10px] font-black text-emerald-500 uppercase tracking-widest">Awaiting Remote Handshake</p>
                </div>
                <textarea id="codeOut" readonly class="w-full h-[350px] bg-[#050505] border border-emerald-500/10 p-8 rounded-[50px] outline-none code-font text-emerald-500/40 italic"></textarea>
            </div>
        </main>

        <section class="grid grid-cols-2 md:grid-cols-5 gap-4 mt-12">
            <div class="glass p-6 rounded-[30px] text-center"><p class="text-[8px] opacity-50 uppercase mb-2">Energy</p><p id="stat_energy" class="text-xl font-black">0 kWh</p></div>
            <div class="glass p-6 rounded-[30px] text-center border-b-2 border-red-500"><p class="text-[8px] opacity-50 uppercase mb-2">Worst Bill</p><p id="stat_worst" class="text-xl font-black">₹0</p></div>
            <div class="glass p-6 rounded-[30px] text-center border-b-2 border-emerald-500"><p class="text-[8px] opacity-50 uppercase mb-2">Optimized</p><p id="stat_opt" class="text-xl font-black">₹0</p></div>
            <div class="glass p-6 rounded-[30px] text-center border-b-2 border-blue-500"><p class="text-[8px] opacity-50 uppercase mb-2">Savings</p><p id="stat_diff" class="text-xl font-black">₹0</p></div>
            <div class="bg-emerald-500/10 p-6 rounded-[30px] text-center border border-emerald-500/30"><p class="text-[8px] text-emerald-400 uppercase mb-2">CEO Fee (35%)</p><p id="stat_fee" class="text-2xl font-black text-emerald-400">₹0</p></div>
        </section>

        <footer class="mt-12 grid md:grid-cols-3 gap-8 bg-[#080808] p-10 rounded-[60px] border border-white/5 items-center">
            <div id="qrBox" class="flex items-center justify-center h-40">READY</div>
            <div class="md:col-span-2 space-y-4">
                <button onclick="requestApproval()" class="btn-emerald w-full py-10 rounded-[40px] font-black text-xs tracking-[0.4em] uppercase text-white shadow-2xl">Notify CEO & Submit</button>
                <div id="downloadArea" class="hidden-element">
                    <button onclick="generatePDF()" class="w-full bg-white text-black py-4 rounded-3xl text-[10px] font-black uppercase tracking-widest hover:bg-emerald-500 hover:text-white transition-all">Download Audit Report (.PDF)</button>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
