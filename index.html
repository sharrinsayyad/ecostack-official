<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOSTACK AI | Enterprise Terminal</title>
    
    <script>
        // MILITARY GRADE SECURITY
        document.oncontextmenu = () => false;
        document.onkeydown = (e) => {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) || (e.ctrlKey && e.keyCode == 85)) return false;
        };
        const sanitize = (str) => str.replace(/[<>]/g, tag => ({ '<': '&lt;', '>': '&gt;' }[tag]));
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');
        :root { --emerald: #10b981; --bg: #000000; }
        body { background: var(--bg); color: #ecfdf5; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .emerald-glass { background: rgba(6, 78, 59, 0.08); backdrop-filter: blur(25px); border: 1px solid rgba(16, 185, 129, 0.15); }
        .code-screen { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
        .btn-emerald { background: linear-gradient(135deg, #10b981 0%, #059669 100%); transition: all 0.3s ease; }
        .btn-emerald:hover { filter: brightness(1.2); transform: scale(1.02); }
        .locked-blur { filter: blur(12px); opacity: 0.2; pointer-events: none; }
        .card-glow { border-top: 2px solid var(--emerald); box-shadow: 0 -10px 20px rgba(16, 185, 129, 0.05); }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4QK67Y22aYtzUgMNESQfXVax51Tk2zy0",
            authDomain: "autostack-ai.firebaseapp.com",
            projectId: "autostack-ai",
            storageBucket: "autostack-ai.firebasestorage.app",
            messagingSenderId: "35493907558",
            appId: "1:35493907558:web:34c1c21e5a85bcae2131a7"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentKey = null;
        let audit = { units: 0, bill: 0, savings: 0, fee: 0, srv: 1, original: "", optimized: "" };

        // --- REALISTIC AUDIT ENGINE ---
        window.processAudit = function() {
            audit.original = document.getElementById('codeIn').value;
            audit.srv = parseInt(document.getElementById('srvInput').value) || 1;
            
            if(audit.original.length < 15) return;

            // AI Logic: Clean and Compress
            audit.optimized = `/* ECOSTACK AI OPTIMIZED NODE */\n// Infrastructure: ${audit.srv} Units\n// Date: ${new Date().toLocaleDateString()}\n\n` + audit.original.replace(/\s\s+/g, ' ').trim();

            // Financial Logic (Server Bill + Electricity + Cooling)
            const baseEnergy = (audit.original.length * 0.048 * audit.srv);
            const coolingCost = baseEnergy * 0.40; // 40% extra for cooling
            audit.units = baseEnergy + coolingCost;
            
            const electricityBill = audit.units * 13.80;
            const maintenanceBill = audit.srv * 450; // ₹450 per server maintenance
            audit.bill = electricityBill + maintenanceBill;

            const efficiency = 0.72; // 72% Efficiency gain
            audit.savings = audit.bill * efficiency;
            audit.fee = (audit.savings * 0.35).toFixed(2);

            document.getElementById('res1').innerText = audit.units.toFixed(0) + " kWh";
            document.getElementById('res2').innerText = "₹" + audit.bill.toFixed(2);
            document.getElementById('res3').innerText = "₹" + audit.savings.toFixed(2);
            document.getElementById('res4').innerText = "₹" + audit.fee;
            
            const upi = `upi://pay?pa=9096530829@okbizaxis&am=${audit.fee}&cu=INR&pn=ECOSTACK%20AI`;
            document.getElementById('qrBox').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(upi)}" class="mx-auto rounded-3xl border-2 border-emerald-500 shadow-2xl">`;
        };

        // --- HANDSHAKE & LIVE UNLOCK ---
        window.sendRequest = function() {
            if(audit.fee <= 0) return alert("Audit Code First");
            const rid = "ECO-" + Math.floor(Math.random()*90000 + 10000);
            
            const log = {
                id: rid, date: new Date().toLocaleDateString(), time: new Date().toLocaleTimeString(),
                original: audit.original, optimized: audit.optimized,
                fee: audit.fee, srv: audit.srv, bill: audit.bill.toFixed(2),
                savings: audit.savings.toFixed(2), status: "PENDING"
            };

            const refPush = push(ref(db, 'history'), log);
            currentKey = refPush.key;

            // REAL-TIME LISTENER FOR CEO APPROVAL
            onValue(ref(db, `history/${currentKey}`), (snap) => {
                if(snap.val()?.status === "APPROVED") {
                    document.getElementById('lockLayer').style.display = 'none';
                    document.getElementById('codeOut').classList.remove('locked-blur');
                    document.getElementById('codeOut').value = snap.val().optimized;
                    document.getElementById('lockMsg').innerText = "ACCESS GRANTED BY CEO";
                }
            });

            window.open(`https://wa.me/9096530829?text=CEO%20Handshake%0AID:${rid}%0AFee:₹${audit.fee}%0ADate:${log.date}`);
            document.getElementById('lockMsg').innerText = "PENDING CEO APPROVAL: " + rid;
        };

        // --- ADMIN MODULE ---
        window.ceoLogin = function() {
            if(document.getElementById('ceoKey').value === "rubinaramjan@14") {
                document.getElementById('userSide').classList.add('hidden');
                document.getElementById('ceoSide').classList.remove('hidden');
                fetchHistory();
            }
        };

        function fetchHistory() {
            onValue(ref(db, 'history'), (snap) => {
                const list = document.getElementById('historyFeed');
                list.innerHTML = "";
                const data = snap.val();
                if(data) Object.keys(data).reverse().forEach(k => {
                    const r = data[k];
                    list.innerHTML += `
                    <div class="emerald-glass p-6 rounded-[35px] mb-6 border-l-4 ${r.status==='APPROVED'?'border-emerald-500':'border-red-600'}">
                        <div class="flex justify-between items-center mb-4">
                            <div><p class="text-emerald-400 font-bold">${r.id} | ${r.date}</p></div>
                            <div class="flex gap-2">
                                <button onclick="setStatus('${k}','APPROVED')" class="bg-emerald-600 px-4 py-1 rounded-lg text-[10px] font-black">APPROVE</button>
                                <button onclick="deleteReq('${k}')" class="bg-red-600 px-4 py-1 rounded-lg text-[10px] font-black">REJECT</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <pre class="bg-black/80 p-3 rounded-xl text-[8px] h-24 overflow-auto text-slate-500">${sanitize(r.original)}</pre>
                            <pre class="bg-black/80 p-3 rounded-xl text-[8px] h-24 overflow-auto text-emerald-300">${sanitize(r.optimized)}</pre>
                        </div>
                    </div>`;
                });
            });
        }
        window.setStatus = (k, s) => update(ref(db, `history/${k}`), { status: s });
        window.deleteReq = (k) => remove(ref(db, `history/${k}`));

        // --- PROFESSIONAL PDF ---
        window.getPDF = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFillColor(0, 0, 0); doc.rect(0, 0, 210, 297, 'F');
            doc.setTextColor(16, 185, 129); doc.setFontSize(24); doc.text("ECOSTACK AI - AUDIT", 20, 30);
            doc.setFontSize(10); doc.setTextColor(255, 255, 255);
            doc.text(`DATE: ${new Date().toLocaleString()}`, 20, 45);
            doc.text(`SERVER INFRASTRUCTURE NODES: ${audit.srv}`, 20, 52);
            doc.text(`-----------------------------------------------------------------`, 20, 60);
            doc.text(`TOTAL OPERATIONAL COST (SERVER + POWER): ₹${audit.bill.toFixed(2)}`, 20, 75);
            doc.text(`AI OPTIMIZED COST: ₹${(audit.bill - audit.savings).toFixed(2)}`, 20, 83);
            doc.setTextColor(16, 185, 129); doc.text(`TOTAL ANNUAL SAVINGS: ₹${audit.savings.toFixed(2)}`, 20, 95);
            doc.setTextColor(255, 255, 255); doc.text(`CEO COMMISSION (35%): ₹${audit.fee}`, 20, 103);
            doc.text("ORIGINAL CODE (AUDITED):", 20, 120);
            doc.setTextColor(100, 100, 100); doc.text(audit.original.substring(0, 600) + "...", 20, 130, {maxWidth: 170});
            doc.setTextColor(16, 185, 129); doc.text("OPTIMIZED CODE (DEPLOYED):", 20, 200);
            doc.setTextColor(200, 200, 200); doc.text(audit.optimized.substring(0, 600) + "...", 20, 210, {maxWidth: 170});
            doc.save("Ecostack_Report.pdf");
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('codeIn').oninput = processAudit;
            document.getElementById('srvInput').oninput = processAudit;
        });
    </script>
</head>
<body class="p-4 md:p-10">

    <div id="ceoSide" class="hidden max-w-5xl mx-auto py-10">
        <h1 class="text-4xl font-black italic text-emerald-500 mb-10 tracking-tighter">CEO COMMAND CENTER</h1>
        <div id="historyFeed"></div>
        <button onclick="location.reload()" class="mt-10 text-emerald-900 text-[10px] font-black uppercase underline">Close Session</button>
    </div>

    <div id="userSide" class="max-w-7xl mx-auto space-y-10">
        
        <div class="flex flex-col md:flex-row justify-between items-center emerald-glass p-10 rounded-[50px] border-b-8 border-emerald-500">
            <div>
                <h1 class="text-6xl font-black italic text-emerald-500 tracking-tighter">ECOSTACK AI</h1>
                <p class="text-[10px] text-emerald-800 font-black uppercase tracking-[0.5em] mt-2 italic">Infrastructure Efficiency Lab</p>
            </div>
            <div class="flex items-center gap-6 mt-8 md:mt-0">
                <div class="bg-emerald-950/40 p-5 rounded-3xl border border-emerald-800 flex items-center gap-4">
                    <span class="text-xs font-bold text-emerald-800 uppercase">Nodes:</span>
                    <input type="number" id="srvInput" value="1" min="1" class="bg-transparent w-14 text-emerald-400 font-black outline-none text-3xl text-center">
                </div>
                <input type="password" id="ceoKey" oninput="ceoLogin()" placeholder="CEO PIN" class="bg-emerald-950/40 border-2 border-emerald-900/20 p-5 rounded-3xl text-xs w-40 text-center outline-none focus:border-emerald-500 text-emerald-500 font-black transition-all">
            </div>
        </div>

        <div class="grid lg:grid-cols-2 gap-10">
            <div class="space-y-4">
                <p class="text-xs font-black text-emerald-900 uppercase tracking-widest px-8">Source Audit</p>
                <textarea id="codeIn" class="w-full h-[420px] bg-black border border-emerald-900/30 p-10 rounded-[70px] outline-none code-screen text-emerald-50 focus:border-emerald-500/40 shadow-2xl" placeholder="Paste Ganda Code..."></textarea>
            </div>
            <div class="relative space-y-4">
                <p class="text-xs font-black text-emerald-900 uppercase tracking-widest px-8">AI Manifestation</p>
                <div id="lockLayer" class="absolute inset-0 z-20 bg-black/98 flex flex-col items-center justify-center rounded-[70px] border border-emerald-900/40 mt-8">
                    <div class="text-emerald-500 text-5xl mb-6 animate-pulse">🔒</div>
                    <p class="text-[11px] font-black text-emerald-800 uppercase tracking-widest" id="lockMsg">Verification Required</p>
                </div>
                <textarea id="codeOut" readonly class="locked-blur w-full h-[420px] bg-black border border-emerald-900/30 p-10 rounded-[70px] outline-none code-screen text-emerald-400 italic" placeholder="// Awaiting Audit..."></textarea>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-5 gap-6">
            <div class="emerald-glass p-8 rounded-[40px] text-center card-glow">
                <p class="text-[9px] text-emerald-800 font-black uppercase">Energy Load</p>
                <p id="res1" class="text-xl font-black text-white mt-1">0 kWh</p>
            </div>
            <div class="emerald-glass p-8 rounded-[40px] text-center card-glow">
                <p class="text-[9px] text-emerald-800 font-black uppercase">Server Bill</p>
                <p id="res2" class="text-xl font-black text-white mt-1">₹0.00</p>
            </div>
            <div class="emerald-glass p-8 rounded-[40px] text-center card-glow border-emerald-500">
                <p class="text-[9px] text-emerald-500 font-black uppercase">Total Savings</p>
                <p id="res3" class="text-xl font-black text-white mt-1">₹0.00</p>
            </div>
            <div class="bg-emerald-600/10 border-2 border-emerald-500/30 p-8 rounded-[40px] text-center">
                <p class="text-[9px] text-emerald-400 font-black uppercase">CEO FEE (35%)</p>
                <p id="res4" class="text-2xl font-black text-emerald-500 mt-1">₹0.00</p>
            </div>
            <div class="emerald-glass p-8 rounded-[40px] text-center card-glow">
                <p class="text-[9px] text-emerald-800 font-black uppercase">Session Security</p>
                <p class="text-xl font-black text-emerald-600 mt-1 italic uppercase">AES-256</p>
            </div>
        </div>

        <div class="grid md:grid-cols-3 gap-10 items-center emerald-glass p-12 rounded-[80px]">
            <div id="qrBox" class="bg-white p-5 rounded-[45px] w-56 h-56 mx-auto flex items-center justify-center shadow-inner text-slate-300 font-black text-xs">READY</div>
            <div class="md:col-span-2 space-y-8">
                <button onclick="sendRequest()" class="btn-emerald w-full py-12 rounded-[50px] font-black text-sm tracking-[0.5em] uppercase text-white shadow-2xl">Unlock & Request Approval</button>
                <div class="flex gap-4">
                    <button onclick="getPDF()" class="flex-1 bg-emerald-950/40 border border-emerald-800 py-6 rounded-[35px] text-[10px] font-black uppercase text-emerald-500 tracking-widest">Download Audit PDF</button>
                    <div class="flex-1 flex items-center justify-center text-[10px] text-emerald-900 font-black uppercase tracking-[0.4em]">Protected by Ecostack AI</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
